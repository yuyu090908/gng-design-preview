# 品質チェック：本番データでビルド → 回帰テスト → 公開サイトの Lighthouse 計測
# 結果は ci-results ブランチに保存する
name: quality

on:
  push:
    branches: [main]
  deployment_status:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quality-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build with live data
        run: npm run build 2>&1 | tee build.log
      - name: Build tests
        run: npm test 2>&1 | tee test.log
      - run: npx playwright install --with-deps chromium
      - name: E2E tests
        run: npm run test:e2e 2>&1 | tee e2e.log
      - name: Save results
        if: always()
        run: |
          mkdir -p out
          cp build.log test.log e2e.log out/ 2>/dev/null || true
          echo "${{ job.status }}" > out/status.txt
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git fetch origin ci-results || true
          git worktree add -B ci-results ../res origin/ci-results 2>/dev/null || (git worktree add --detach ../res && cd ../res && git checkout --orphan ci-results && git rm -rfq . || true)
          mkdir -p ../res/test && cp out/* ../res/test/
          echo "${GITHUB_SHA}" > ../res/test/sha.txt
          cd ../res && git add -A && git commit -qm "test results ${GITHUB_SHA::7}" && for i in 1 2 3; do git push origin ci-results && break || (git pull --rebase origin ci-results || true); done

  lighthouse:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE: https://gng-design-preview-4dlc.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lighthouse
        run: |
          mkdir -p lh
          sleep 20
          for p in "/" "/category/%E5%9B%BD%E5%86%85%E9%A2%A8%E4%BF%97/" "/category/%E6%B5%B7%E5%A4%96%E9%A2%A8%E4%BF%97/" "/2965/"; do
            name=$(echo "$p" | tr -c 'A-Za-z0-9' '_')
            npx -y lighthouse@12 "$SITE$p" --quiet --output=json --output-path="lh/mobile$name.json" --chrome-flags="--headless=new --no-sandbox" || true
            npx -y lighthouse@12 "$SITE$p" --quiet --preset=desktop --output=json --output-path="lh/desktop$name.json" --chrome-flags="--headless=new --no-sandbox" || true
          done
          node scripts/lighthouse-summary.mjs lh
      - name: Save results
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git fetch origin ci-results || true
          git worktree add -B ci-results ../res origin/ci-results 2>/dev/null || (git worktree add --detach ../res && cd ../res && git checkout --orphan ci-results && git rm -rfq . || true)
          mkdir -p ../res/lighthouse && cp lh/summary.* ../res/lighthouse/ 2>/dev/null || true
          echo "${GITHUB_SHA}" > ../res/lighthouse/sha.txt
          cd ../res && git add -A && git commit -qm "lighthouse ${GITHUB_SHA::7}" && for i in 1 2 3; do git push origin ci-results && break || (git pull --rebase origin ci-results || true); done
